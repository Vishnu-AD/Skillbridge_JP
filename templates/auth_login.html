{% extends "layout.html" %}
{% block title %}Login • SkillBridge JP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="cardx p-4 p-lg-5">
      <div class="big-title mb-1">Welcome back</div>
      <div class="subtle mb-4">Login to access your SkillBridge JP workspace.</div>

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" name="email" placeholder="name@example.com" required/>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required/>
        </div>

        <button class="btn btn-dark w-100 py-2">Login</button>
        <div class="mt-3 subtle">No account? <a href="{{ url_for('register') }}">Create one</a></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
