{% extends "layout.html" %}
{% block title %}Register • SkillBridge JP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="cardx p-4 p-lg-5">
      <div class="big-title mb-1">Create your account</div>
      <div class="subtle mb-4">Candidate, recruiter, or admin.</div>

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Role</label>
            <select class="form-select" name="role">
              <option value="candidate">Candidate</option>
              <option value="recruiter">Recruiter</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Full name</label>
            <input class="form-control" name="full_name" required/>
          </div>
          <div class="col-12">
            <label class="form-label">Email</label>
            <input class="form-control" name="email" required/>
          </div>
          <div class="col-12">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required/>
          </div>
        </div>

        <button class="btn btn-dark w-100 mt-4 py-2">Create account</button>
        <div class="mt-3 subtle">Already have one? <a href="{{ url_for('login') }}">Login</a></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
