{% extends "layout.html" %}
{% block title %}Post Job • SkillBridge JP{% endblock %}
{% block content %}
<div class="big-title mb-1">Post a Job</div>
<div class="subtle mb-4">Paste Japanese JD — system extracts skills and maps candidates.</div>

<div class="cardx p-4">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Job Title</label>
        <input class="form-control" name="title" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Company</label>
        <input class="form-control" name="company" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Location</label>
        <input class="form-control" name="location" placeholder="Tokyo / Remote">
      </div>
      <div class="col-md-6">
        <label class="form-label">Years required</label>
        <input class="form-control" type="number" name="years_required" value="0">
      </div>
      <div class="col-12">
        <label class="form-label">Job Description (Japanese/English)</label>
        <textarea class="form-control" name="jd_text" rows="8" required
          placeholder="Paste JD here..."></textarea>
      </div>
    </div>
    <button class="btn btn-dark mt-4 px-4">Post Job</button>
  </form>
</div>
{% endblock %}
